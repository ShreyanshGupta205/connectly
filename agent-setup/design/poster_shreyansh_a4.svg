<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842" style="background-color: #07090e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="297.5" cy="160" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" />

  <!-- Brand Header -->
  <text x="297.5" y="60" text-anchor="middle" fill="#6366f1" font-size="14" font-weight="700" letter-spacing="2">CONNECTLY • OPEN SOURCE BIO-LINK</text>

  <!-- Creator Name -->
  <text x="297.5" y="120" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="800">Shreyansh Gupta</text>
  
  <!-- Creator Handle -->
  <text x="297.5" y="150" text-anchor="middle" fill="#94a3b8" font-size="16" font-family="monospace">@shreyansh</text>

  <!-- Tagline -->
  <text x="297.5" y="190" text-anchor="middle" fill="#94a3b8" font-size="13">Open-source AI developer and hackathon builder</text>

  <!-- QR Code Container Box -->
  <rect x="167.5" y="230" width="260" height="260" rx="24" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- QR Target Text Placeholder -->
  <text x="297.5" y="365" text-anchor="middle" fill="#ffffff" font-size="12" font-family="monospace">QR: {{SITE_URL}}/@shreyansh?s=poster</text>

  <!-- Footer Call to Action -->
  <text x="297.5" y="802" text-anchor="middle" fill="#6366f1" font-size="13" font-weight="600">Scan to view GitHub repos, live demos &amp; download vCard</text>
</svg>